name: Test & Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux GUI test libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0t64 \
            libxkbcommon0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade "pip==25.3"
          python -m pip install -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation \
            -e packages/ember-core \
            -e packages/ember-agent \
            -e .
          python -m pip check

      - name: Compile
        run: python -m compileall -q src packages

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -q \
            --ignore=tests/test_execution_center.py \
            --ignore=tests/test_gui_workspace.py \
            --ignore=tests/test_workflow_gui.py \
            --ignore=tests/test_task_center.py
          pytest -q tests/test_execution_center.py
          pytest -q tests/test_gui_workspace.py
          pytest -q tests/test_workflow_gui.py
          pytest -q tests/test_task_center.py

  build-macos:
    name: Package macOS arm64
    needs: test
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and smoke test
        env:
          VB_BUILD_PYTHON: python3.12
        run: ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vermilion-Bird-macOS-arm64-${{ github.ref_name }}
          path: |
            dist/Vermilion-Bird-macOS-arm64.zip
            dist/Vermilion-Bird-macOS-arm64.zip.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Vermilion-Bird-macOS-arm64.zip
            dist/Vermilion-Bird-macOS-arm64.zip.sha256
