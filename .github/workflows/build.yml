name: Test & Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          pip install -r requirements-build.lock
          pip install --no-deps --no-build-isolation \
            -e packages/ember-core \
            -e packages/ember-agent \
            -e .
          pip check

      - name: Compile
        run: python -m compileall -q src packages

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build-macos:
    name: Package macOS arm64
    needs: test
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and smoke test
        env:
          VB_BUILD_PYTHON: python3.12
        run: ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vermilion-Bird-macOS-arm64-${{ github.ref_name }}
          path: |
            dist/Vermilion-Bird-macOS-arm64.zip
            dist/Vermilion-Bird-macOS-arm64.zip.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Vermilion-Bird-macOS-arm64.zip
            dist/Vermilion-Bird-macOS-arm64.zip.sha256
