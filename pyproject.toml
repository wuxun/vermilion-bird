[tool.poetry]
name = "vermilion-bird"
version = "0.3.0"
description = "A local-first, auditable and recoverable AI work execution desktop"
authors = ["Xun Wu"]
readme = "README.md"
packages = [{include = "llm_chat", from = "src"}]

[tool.poetry.urls]
Homepage = "https://github.com/wuxun/vermilion-bird"
Repository = "https://github.com/wuxun/vermilion-bird"
Issues = "https://github.com/wuxun/vermilion-bird/issues"

[tool.poetry.scripts]
vermilion-bird = "llm_chat.cli:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
ember-core = { path = "packages/ember-core", develop = true }
ember-agent = { path = "packages/ember-agent", develop = true }
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
pyyaml = "^6.0.0"
lark-oapi = { version = "^1.0.0", optional = true }
requests = "^2.31.0"
click = "^8.1.7"
PyQt6 = { version = "^6.6.0", optional = true }
markdown = { version = "^3.5.0", optional = true }
mcp = "^1.0.0"
httpx = "^0.27.0"
httpx-sse = "^0.4.0"
langgraph = "^1.2.9"
langgraph-checkpoint-sqlite = "^3.1.0"
duckduckgo-search = "^6.0.0"
ddgs = "^9.0.0"
tiktoken = "^0.13.0"
beautifulsoup4 = "^4.12.0"
playwright = { version = "^1.40.0", optional = true }
apscheduler = "^3.9.1"
sqlalchemy = "^2.0.0"
trafilatura = "^1.7.0"
feedparser = "^6.0.0"
keyring = { version = "^24.0.0", optional = true }
jieba = { version = "^0.42.1", optional = true }
numpy = { version = "^1.24.0", optional = true }
sentence-transformers = { version = "^3.0.0", optional = true }

[tool.poetry.extras]
gui = ["PyQt6", "markdown"]
feishu = ["lark-oapi"]
browser = ["playwright"]
secure-storage = ["keyring"]
chinese-search = ["jieba"]
semantic-knowledge = ["numpy", "sentence-transformers"]
all = [
    "PyQt6",
    "markdown",
    "lark-oapi",
    "playwright",
    "keyring",
    "jieba",
    "numpy",
    "sentence-transformers",
]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.11.0"
flake8 = "^6.1.0"
pyinstaller = "6.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  | \.git
  | \.venv
  | venv
  | __pycache__
)/
'''

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", ".venv", "venv"]
